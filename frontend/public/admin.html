<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Admin - Users List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/admin.css">
    <script src="/config.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/app.js"></script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap">
        <h1>Admin Panel</h1>
        <div class="sub">API Statistics & User Management</div>
        
        <div class="admin-actions">
            <button id="refresh-btn" class="admin-btn">Refresh All</button>
        </div>

        <div id="loading" class="loading hidden">
            <p>Loading data...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <!-- API Endpoint Statistics -->
        <section class="admin-section">
            <div class="section-header">
                <h2>API Endpoint Statistics</h2>
                <button id="refresh-endpoints-btn" class="admin-btn-small">Refresh</button>
            </div>
            <div id="endpoints-container" class="stats-container">
                <p class="loading">Loading endpoint statistics...</p>
            </div>
        </section>

        <!-- User API Consumption Statistics -->
        <section class="admin-section">
            <div class="section-header">
                <h2>User API Consumption</h2>
                <button id="refresh-consumption-btn" class="admin-btn-small">Refresh</button>
            </div>
            <div id="consumption-container" class="stats-container">
                <p class="loading">Loading consumption statistics...</p>
            </div>
        </section>

        <!-- Users List -->
        <section class="admin-section">
            <div class="section-header">
                <h2>All Users</h2>
                <span id="user-count" class="user-count">0 users</span>
            </div>
            <div id="users-list" class="users-list"></div>
        </section>
    </div>
    <script src="/auth/headerUtils.js"></script>
    <script>
        // Ensure headerUtils is loaded before modules execute
        (function() {
            if (!window.__headerUtilsReady) {
                const checkReady = setInterval(function() {
                    if (window.__headerUtilsReady && window.initLoggedInHeader) {
                        clearInterval(checkReady);
                        loadAdminModule();
                    }
                }, 10);
                setTimeout(function() {
                    clearInterval(checkReady);
                    if (!window.__headerUtilsReady) {
                        console.error('headerUtils.js failed to load');
                    }
                    loadAdminModule();
                }, 1000);
            } else {
                loadAdminModule();
            }
            
            function loadAdminModule() {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '/auth/admin.js';
                document.body.appendChild(script);
            }
        })();
    </script>
    <script>
        window.__adminInitialized = true;
    </script>
</body>

</html>
