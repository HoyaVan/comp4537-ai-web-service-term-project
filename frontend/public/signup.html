<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/signup.css">
    <script src="/config.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/app.js"></script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap">
        <h1>Create account</h1>
        <div class="sub">Backend: <span id="backend-url"></span></div>

        <form id="signup-form" novalidate>
            <label for="name">First Name</label>
            <input id="name" name="name" type="text" placeholder="Jane" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" minlength="6" required>

            <label for="confirm">Confirm Password</label>
            <input id="confirm" name="confirm" type="password" placeholder="••••••••" minlength="6" required>

            <button id="submit-btn" type="submit" class="btn">Sign up</button>
            <div class="hint">By signing up you agree to our terms.</div>
            <div id="message" class="msg"></div>
        </form>
    </div>
    <script src="/auth/headerUtils.js"></script>
    <script type="module">
        // Initialize signup page with new auth system
        import { authMessages } from '/messages/auth.js';
        
        const form = document.getElementById('signup-form');
        const msg = document.getElementById('message');
        const btn = document.getElementById('submit-btn');
        const backend = document.getElementById('backend-url');

        if (backend) backend.textContent = window.getBackendUrl();

        function setMessage(text, ok = false) {
            if (msg) {
                msg.textContent = text;
                msg.className = 'msg ' + (ok ? 'ok' : 'err');
            }
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                setMessage('');
                const name = document.getElementById('name').value || '';
                const email = document.getElementById('email').value || '';
                const password = document.getElementById('password').value || '';
                const confirm = document.getElementById('confirm').value || '';

                if (!name.trim()) return setMessage(authMessages.firstNameRequired);
                if (!email.trim()) return setMessage(authMessages.emailRequired);
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMessage(authMessages.emailInvalid);
                if (!password) return setMessage(authMessages.passwordRequired);
                if (password.length < 6) return setMessage(authMessages.passwordMinLength);
                if (password !== confirm) return setMessage(authMessages.passwordsNotMatch);

                btn.disabled = true;
                btn.textContent = authMessages.signingUp;
                
                try {
                    const result = await window.authService.signup(name, email, password);
                    if (result.success) {
                        setMessage(authMessages.successPrefix + result.message, true);
                        form.reset();
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1000);
                    } else {
                        setMessage(authMessages.signupFailed + result.message, false);
                    }
                } catch (err) {
                    setMessage(authMessages.networkError + err, false);
                } finally {
                    btn.disabled = false;
                    btn.textContent = authMessages.signUp;
                }
            });
        }

        // Initialize header
        if (typeof initLoggedOutHeader === 'function') {
            initLoggedOutHeader();
        }
    </script>
</body>

</html>
