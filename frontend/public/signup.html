<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/signup.css">
    <script>
        // Auto-detect backend URL based on environment
        const hostname = window.location.hostname;
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
            window.BACKEND_URL = 'http://localhost:3000';
        } else {
            // Production backend URL
            window.BACKEND_URL = 'https://dj-clownfish-uxa88.ondigitalocean.app';
        }
    </script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <header class="header">
    <div class="header-content">
        <a href="/" class="logo">DJ Clownfish</a>
        <nav class="header-nav">
            <a href="/login.html" class="header-btn">Login</a>
            <a href="/signup.html" class="header-btn header-btn-primary">Sign Up</a>
        </nav>
    </div>
</header>


    <div class="wrap">
        <h1>Create account</h1>
        <div class="sub">Backend: <span id="backend-url"></span></div>

        <form id="signup-form" novalidate>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Jane Doe" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" minlength="6" required>

            <label for="confirm">Confirm Password</label>
            <input id="confirm" name="confirm" type="password" placeholder="••••••••" minlength="6" required>

            <button id="submit-btn" type="submit" class="btn">Sign up</button>
            <div class="hint">By signing up you agree to our terms.</div>
            <div id="message" class="msg"></div>
        </form>
    </div>
    <script src="/auth/signup.js"></script>
</body>

</html>
