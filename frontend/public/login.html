<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/login.css">
    <script src="/config.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/app.js"></script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap">
        <h1>Log in</h1>
        <div class="sub">Backend: <span id="backend-url"></span></div>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required>

            <button id="submit-btn" type="submit" class="btn">Login</button>
            <div id="message" class="msg"></div>
        </form>
    </div>
    <script src="/auth/headerUtils.js"></script>
    <script type="module">
        // Initialize login page with new auth system
        import { authMessages } from '/messages/auth.js';
        
        const form = document.getElementById('login-form');
        const msg = document.getElementById('message');
        const btn = document.getElementById('submit-btn');
        const backend = document.getElementById('backend-url');

        if (backend) backend.textContent = window.getBackendUrl();

        function setMessage(text, ok = false) {
            if (msg) {
                msg.textContent = text;
                msg.className = 'msg ' + (ok ? 'ok' : 'err');
            }
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('[LOGIN] Form submission started');
                setMessage('');
                const email = document.getElementById('email').value || '';
                const password = document.getElementById('password').value || '';

                console.log('[LOGIN] Validating input - email:', email ? email.substring(0, 3) + '***' : 'empty', 'password:', password ? '***' : 'empty');
                
                if (!email.trim()) {
                    console.log('[LOGIN] Validation failed: email required');
                    return setMessage(authMessages.emailRequired);
                }
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
                    console.log('[LOGIN] Validation failed: invalid email format');
                    return setMessage(authMessages.emailInvalid);
                }
                if (!password) {
                    console.log('[LOGIN] Validation failed: password required');
                    return setMessage(authMessages.passwordRequired);
                }

                console.log('[LOGIN] Input validation passed, calling authService.login()');
                btn.disabled = true;
                btn.textContent = authMessages.loggingIn;
                
                try {
                    const loginStartTime = Date.now();
                    const result = await window.authService.login(email, password);
                    const loginDuration = Date.now() - loginStartTime;
                    
                    console.log(`[LOGIN] authService.login() completed in ${loginDuration}ms`, {
                        success: result.success,
                        message: result.message,
                        hasUser: !!result.user
                    });
                    
                    if (result.success) {
                        console.log('[LOGIN] Login successful, setting success message');
                        setMessage(authMessages.successPrefix + result.message, true);
                        
                        // Helper function to wait/delay using Promise
                        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
                        
                        console.log('[LOGIN] Waiting 200ms for httpOnly cookie to be processed by browser...');
                        // Wait briefly for the httpOnly cookie to be processed by the browser
                        await delay(200);
                        console.log('[LOGIN] Cookie processing delay completed');
                        
                        // Verify authentication with one retry if needed
                        try {
                            console.log('[LOGIN] Verifying authentication status...');
                            const authCheckStartTime = Date.now();
                            let isAuth = await window.authService.isAuthenticated();
                            const authCheckDuration = Date.now() - authCheckStartTime;
                            
                            console.log(`[LOGIN] Initial auth verification completed in ${authCheckDuration}ms - authenticated:`, isAuth);
                            
                            if (!isAuth) {
                                console.log('[LOGIN] Authentication verification failed, retrying after 300ms delay...');
                                // Retry once after a short delay
                                await delay(300);
                                const retryStartTime = Date.now();
                                isAuth = await window.authService.isAuthenticated();
                                const retryDuration = Date.now() - retryStartTime;
                                console.log(`[LOGIN] Retry auth verification completed in ${retryDuration}ms - authenticated:`, isAuth);
                            } else {
                                console.log('[LOGIN] Authentication verified successfully');
                            }
                        } catch (authErr) {
                            console.error('[LOGIN] Auth verification error:', authErr);
                            console.warn('[LOGIN] Continuing with redirect despite auth verification error');
                        }
                        
                        // Redirect to dashboard (server-side auth will handle verification)
                        const currentUrl = window.location.href;
                        const redirectUrl = '/dashboard';
                        console.log(`[LOGIN] Initiating redirect to ${redirectUrl} from ${currentUrl}`);
                        console.log('[LOGIN] Using window.location.replace() for redirect');
                        window.location.replace(redirectUrl);
                        console.log('[LOGIN] Redirect command executed, page should navigate now');
                        return; // Exit early, don't re-enable button
                    } else {
                        console.log('[LOGIN] Login failed:', result.message);
                        setMessage(authMessages.loginFailed + result.message, false);
                        btn.disabled = false;
                        btn.textContent = authMessages.login;
                    }
                } catch (err) {
                    console.error('[LOGIN] Exception during login process:', err);
                    console.error('[LOGIN] Error details:', {
                        message: err.message,
                        stack: err.stack,
                        name: err.name
                    });
                    setMessage(authMessages.networkError + (err.message || err), false);
                    btn.disabled = false;
                    btn.textContent = authMessages.login;
                }
            });
        }

        // Initialize header
        if (typeof initLoggedOutHeader === 'function') {
            initLoggedOutHeader();
        }
    </script>
</body>

</html>
