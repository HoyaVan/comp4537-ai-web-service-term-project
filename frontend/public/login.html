<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/login.css">
    <script src="/config.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/app.js"></script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap">
        <h1>Log in</h1>
        <div class="sub">Backend: <span id="backend-url"></span></div>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required>

            <button id="submit-btn" type="submit" class="btn">Login</button>
            <div id="message" class="msg"></div>
        </form>
    </div>
    <script src="/auth/headerUtils.js"></script>
    <script type="module">
        // Initialize login page with new auth system
        import { authMessages } from '/messages/auth.js';
        
        const form = document.getElementById('login-form');
        const msg = document.getElementById('message');
        const btn = document.getElementById('submit-btn');
        const backend = document.getElementById('backend-url');

        if (backend) backend.textContent = window.getBackendUrl();

        function setMessage(text, ok = false) {
            if (msg) {
                msg.textContent = text;
                msg.className = 'msg ' + (ok ? 'ok' : 'err');
            }
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                setMessage('');
                const email = document.getElementById('email').value || '';
                const password = document.getElementById('password').value || '';

                if (!email.trim()) {
                    return setMessage(authMessages.emailRequired);
                }
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
                    return setMessage(authMessages.emailInvalid);
                }
                if (!password) {
                    return setMessage(authMessages.passwordRequired);
                }

                btn.disabled = true;
                btn.textContent = authMessages.loggingIn;
                
                try {
                    const result = await window.authService.login(email, password);
                    
                    if (result.success) {
                        setMessage(authMessages.successPrefix + result.message, true);
                        setTimeout(() => {
                            window.location.replace('/dashboard');
                        }, 1000);
                        return;
                    } else {
                        setMessage(authMessages.loginFailed + result.message, false);
                        btn.disabled = false;
                        btn.textContent = authMessages.login;
                    }
                } catch (err) {
                    setMessage(authMessages.networkError + (err.message || err), false);
                    btn.disabled = false;
                    btn.textContent = authMessages.login;
                }
            });
        }

        // Initialize header
        if (typeof initLoggedOutHeader === 'function') {
            initLoggedOutHeader();
        }
    </script>
</body>

</html>
