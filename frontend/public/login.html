<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/login.css">
    <script src="/config.js"></script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap">
        <h1>Sign in</h1>
        <div class="sub">Backend: <span id="backend-url"></span></div>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required>

            <button id="submit-btn" type="submit" class="btn">Login</button>
            <div id="message" class="msg"></div>
        </form>
    </div>
    <script src="/auth/headerUtils.js"></script>
    <script>
        // Initialize header when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initLoggedOutHeader();
            });
        } else {
            initLoggedOutHeader();
        }
    </script>
    <script src="/auth/login.js"></script>
</body>

</html>
