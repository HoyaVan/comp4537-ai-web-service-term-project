<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/login.css">
    <script src="/config.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/app.js"></script>
    <link rel="shortcut icon" href="#">
</head>
<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap" style="text-align: center;">
        <h1>404 - Page Not Found</h1>
        <p style="color: var(--muted); margin-bottom: 24px;">The page you're looking for doesn't exist.</p>
        <a href="/" class="btn" style="display: inline-block; text-decoration: none; margin-top: 8px;">Return to Home</a>
    </div>
    <script src="/auth/headerUtils.js"></script>
    <script>
        // Initialize header based on auth state
        if (typeof initLoggedOutHeader === 'function') {
            // Check if user is authenticated and show appropriate header
            if (window.authService) {
                window.authService.isAuthenticated().then(isAuth => {
                    if (isAuth && typeof initLoggedInHeader === 'function') {
                        initLoggedInHeader([
                            { href: '/dashboard', text: 'Dashboard' },
                            { href: '/profile', text: 'Profile' }
                        ]);
                    } else if (typeof initLoggedOutHeader === 'function') {
                        initLoggedOutHeader();
                    }
                }).catch(() => {
                    if (typeof initLoggedOutHeader === 'function') {
                        initLoggedOutHeader();
                    }
                });
            } else {
                initLoggedOutHeader();
            }
        }
    </script>
</body>
</html>
