<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Profile - DJ Clownfish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/profile.css">
    <script src="/config.js"></script>
    <script src="/js/authService.js"></script>
    <script src="/js/app.js"></script>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <!-- Header will be loaded by headerUtils.js -->

    <div class="wrap">
        <h1>My Profile</h1>
        <div class="sub">View your account information and individual API consumption</div>

        <!-- User Information Section -->
        <section class="profile-section">
            <h2>Account Information</h2>
            <div id="user-info-container" class="profile-card">
                <p class="loading">Loading user information...</p>
            </div>
        </section>

        <!-- API Consumption Section -->
        <section class="api-consumption-section">
            <h2>Individual API Consumption</h2>
            <div id="api-consumption-container" class="api-consumption-card">
                <p class="loading">Loading API consumption...</p>
            </div>
        </section>
    </div>

    <script src="/auth/headerUtils.js"></script>
    <script>
        // Ensure headerUtils is loaded before modules execute
        (function() {
            if (!window.__headerUtilsReady) {
                const checkReady = setInterval(function() {
                    if (window.__headerUtilsReady && window.initLoggedInHeader) {
                        clearInterval(checkReady);
                        loadProfileModule();
                    }
                }, 10);
                setTimeout(function() {
                    clearInterval(checkReady);
                    if (!window.__headerUtilsReady) {
                        console.error('headerUtils.js failed to load');
                    }
                    loadProfileModule();
                }, 1000);
            } else {
                loadProfileModule();
            }
            
            function loadProfileModule() {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '/auth/profile.js';
                document.body.appendChild(script);
            }
        })();
    </script>
    <script>
        window.__profileInitialized = true;
    </script>
</body>

</html>
