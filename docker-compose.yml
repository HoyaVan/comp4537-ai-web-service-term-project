version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dj-clownfish-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - dj-clownfish-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dj-clownfish-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dj-clownfish-network

networks:
  dj-clownfish-network:
    driver: bridge

